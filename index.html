<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gameslop</title>
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gameslop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #1b2130;
  --muted: #6b7382;
  --line: #d3d8e2;
  --accent: #2358c8;
  --shadow: 0 1px 2px rgb(20 30 60 / 6%), 0 8px 24px rgb(20 30 60 / 8%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1420;
    --panel: #161c2b;
    --ink: #e7ebf3;
    --muted: #8b95a8;
    --line: #2b3346;
    --accent: #6f9bff;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 30%);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(env(safe-area-inset-top), 32px) 16px max(env(safe-area-inset-bottom), 32px);
}
main { max-width: 720px; margin: 0 auto; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 28px;
}
h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
button {
  font: inherit;
  font-size: 14px;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
button:hover { color: var(--ink); border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 20px 12px 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: var(--shadow);
  color: inherit;
  text-decoration: none;
  text-align: center;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
a:hover { transform: translateY(-2px); border-color: var(--accent); }
a:active { transform: scale(0.98); }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
img { width: 72px; height: 72px; border-radius: 18px; }
strong { font-size: 17px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Gameslop</h1>
    <button id="order" type="button" aria-label="Change sort order">Most used</button>
  </header>
  <ul>
    <li>
      <a href="suguru/">
        <img src="suguru/icon-192.png" alt="">
        <strong>Suguru</strong>
      </a>
    </li>
    <li>
      <a href="crowd/">
        <img src="crowd/icon-192.png" alt="">
        <strong>Crowd Run</strong>
      </a>
    </li>
    <li>
      <a href="gems/">
        <img src="gems/icon-192.png" alt="">
        <strong>Gems</strong>
      </a>
    </li>
    <li>
      <a href="blocks/">
        <img src="blocks/icon-192.png" alt="">
        <strong>Blocks</strong>
      </a>
    </li>
    <li>
      <a href="bubbles/">
        <img src="bubbles/icon-192.png" alt="">
        <strong>Bubbles</strong>
      </a>
    </li>
    <li>
      <a href="minesweeper/">
        <img src="minesweeper/icon-192.png" alt="">
        <strong>Minesweeper</strong>
      </a>
    </li>
  </ul>
</main>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

// Count how often each game is opened, and list them by use or alphabetically.
var USES_KEY = 'gameslop-uses';
var ORDER_KEY = 'gameslop-order';

function loadUses() {
  try {
    return JSON.parse(localStorage.getItem(USES_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function loadOrder() {
  try {
    if (localStorage.getItem(ORDER_KEY) === 'alpha') {
      return 'alpha';
    }
  } catch (e) {}
  return 'uses';
}

function save(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (e) {}
}

function gameOf(li) {
  return li.querySelector('a').getAttribute('href');
}

function nameOf(li) {
  return li.querySelector('strong').textContent;
}

var list = document.querySelector('ul');
var toggle = document.getElementById('order');
var original = Array.from(list.children);

function render(order) {
  var uses = loadUses();
  original
    .map(function (li, index) { return { li: li, index: index, count: uses[gameOf(li)] || 0 }; })
    .sort(function (a, b) {
      if (order === 'alpha') {
        return nameOf(a.li).localeCompare(nameOf(b.li));
      }
      if (a.count !== b.count) {
        return b.count - a.count;
      }
      return a.index - b.index;
    })
    .forEach(function (entry) { list.appendChild(entry.li); });
  if (order === 'alpha') {
    toggle.textContent = 'A–Z';
  } else {
    toggle.textContent = 'Most used';
  }
}

var order = loadOrder();
render(order);

toggle.addEventListener('click', function () {
  if (order === 'alpha') {
    order = 'uses';
  } else {
    order = 'alpha';
  }
  save(ORDER_KEY, order);
  render(order);
});

list.addEventListener('click', function (event) {
  var link = event.target.closest('a');
  if (!link) {
    return;
  }
  var uses = loadUses();
  var game = link.getAttribute('href');
  uses[game] = (uses[game] || 0) + 1;
  save(USES_KEY, JSON.stringify(uses));
});
</script>
</body>
</html>
