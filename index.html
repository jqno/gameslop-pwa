<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gameslop</title>
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gameslop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #1b2130;
  --muted: #6b7382;
  --line: #d3d8e2;
  --accent: #2358c8;
  --shadow: 0 1px 2px rgb(20 30 60 / 6%), 0 8px 24px rgb(20 30 60 / 8%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1420;
    --panel: #161c2b;
    --ink: #e7ebf3;
    --muted: #8b95a8;
    --line: #2b3346;
    --accent: #6f9bff;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 30%);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(env(safe-area-inset-top), 32px) 16px max(env(safe-area-inset-bottom), 32px);
}
main { max-width: 720px; margin: 0 auto; }
h1 { margin: 0 0 28px; font-size: 28px; letter-spacing: -0.02em; }
ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 20px 12px 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: var(--shadow);
  color: inherit;
  text-decoration: none;
  text-align: center;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
a:hover { transform: translateY(-2px); border-color: var(--accent); }
a:active { transform: scale(0.98); }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
img { width: 72px; height: 72px; border-radius: 18px; }
strong { font-size: 17px; }
</style>
</head>
<body>
<main>
  <h1>Gameslop</h1>
  <ul>
    <li>
      <a href="suguru/">
        <img src="suguru/icon-192.png" alt="">
        <strong>Suguru</strong>
      </a>
    </li>
  </ul>
</main>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
